name: CD Pipeline

on:
  push:
    branches:
      - develop
      - main

jobs:

  deploy-staging:

    if: github.ref == 'refs/heads/develop'

    runs-on: ubuntu-latest

    steps:

      - name: Deploy STAGING
        uses: appleboy/ssh-action@v1

        with:
          host: ${{ secrets.SERVER_HOST_STAGING }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |

            set -e

            cd /srv/liderlux-staging

            echo "🔄 Atualizando código..."
            git fetch origin
            git reset --hard origin/develop

            echo "📦 Atualizando containers..."
            docker compose \
              -f compose/docker-compose.staging.yml \
              pull

            docker compose \
              -f compose/docker-compose.staging.yml \
              up -d --remove-orphans

            echo "✅ Deploy staging concluído"


  deploy-production:

    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      - name: Deploy PROD
        uses: appleboy/ssh-action@v1

        with:
          host: ${{ secrets.SERVER_HOST_PROD }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |

            cd /srv/liderlux-prod

            git pull origin main

            export IMAGE_TAG=latest

            docker compose \
              -f compose/docker-compose.prod.yml \
              pull

            docker compose \
              -f compose/docker-compose.prod.yml \
              up -d
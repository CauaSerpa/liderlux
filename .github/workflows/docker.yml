name: Docker Build & Deploy

on:
  push:
    branches:
      - develop
      - staging
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          build-args: |
            APP_ENV=${{ github.ref_name == 'main' && 'production' || 'staging' }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/liderlux:${{ github.ref_name }}
            ghcr.io/${{ env.OWNER_LC }}/liderlux:${{ github.sha }}

  deploy-staging:
    if: github.ref_name == 'develop'
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Deploy STAGING
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST_STAGING }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            set -e

            cd /srv/liderlux-staging

            echo "Atualizando código para ${{ github.sha }}..."
            git fetch origin
            git checkout -B develop "${{ github.sha }}"

            export IMAGE_TAG=${{ github.sha }}

            echo "Atualizando containers..."

            docker compose \
              --env-file .env.staging \
              -f compose/docker-compose.staging.yml \
              pull

            docker compose \
              --env-file .env.staging \
              -f compose/docker-compose.staging.yml \
              up -d --remove-orphans

            echo "Deploy staging concluído"

  deploy-production:
    if: github.ref_name == 'main'
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Deploy PROD
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST_PROD }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            set -e

            cd /srv/liderlux-prod

            echo "Atualizando código para ${{ github.sha }}..."
            git fetch origin
            git checkout -B main "${{ github.sha }}"

            export IMAGE_TAG=${{ github.sha }}

            echo "Atualizando containers..."

            docker compose \
              -f compose/docker-compose.prod.yml \
              pull

            docker compose \
              -f compose/docker-compose.prod.yml \
              up -d --remove-orphans

            echo "Deploy produção concluído"

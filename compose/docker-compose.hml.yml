version: "3.9"

services:

  app:

    image:
      ghcr.io/softhash/liderlux:${IMAGE_TAG}

    container_name:
      liderlux_app_hml

    env_file:
      - .env

    environment:
      CI_ENV: production

    restart:
      unless-stopped

    networks:
      - liderlux_hml

  nginx:

    image: nginx:alpine

    container_name:
      liderlux_nginx_hml

    restart:
      unless-stopped

    ports:
      - "8086:80"

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

    networks:
      - liderlux_hml

networks:
  liderlux_hml:
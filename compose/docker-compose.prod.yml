services:
  app:
    image: ghcr.io/cauaserpa/liderlux:${IMAGE_TAG}

    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1.5G
        reservations:
          cpus: "1.0"
          memory: 1G

    env_file:
      - ../.env

    environment:
      CI_ENV: production

    restart: unless-stopped

    networks:
      - liderlux_prod

  nginx:
    image: nginx:alpine

    depends_on:
      - app

    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M

    ports:
      - "127.0.0.1:8085:80"

    volumes:
      - ../:/var/www:ro
      - ../docker/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro

    restart: unless-stopped

    networks:
      - liderlux_prod

networks:
  liderlux_prod:
    driver: bridge

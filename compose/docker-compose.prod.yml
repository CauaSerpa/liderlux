services:
  app:
    image: ghcr.io/softhash/liderlux:${IMAGE_TAG}

    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1.5G
        reservations:
          cpus: "1.0"
          memory: 1G

    env_file:
      - .env

    environment:
      CI_ENV: production

    restart: unless-stopped

    networks:
      - liderlux_prod

  nginx:
    image: nginx:alpine

    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M

    ports:
      - "8085:80"

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf

    restart: unless-stopped

    networks:
      - liderlux_prod

networks:
  liderlux_prod:
    driver: bridge

services:

  app:
    build:
      context: ..
      dockerfile: docker/php/Dockerfile
      args:
        APP_ENV: local

    container_name: liderlux_app_local

    volumes:
      - ../:/var/www

    env_file:
      - ../.env.local

    environment:
      DB_HOST: db
      DB_USERNAME: liderlux_user
      DB_PASSWORD: password
      DB_DATABASE: liderlux
      DB_PORT: 3306

    depends_on:
      - db

    networks:
      - liderlux_local

  nginx:
    image: nginx:alpine
    container_name: liderlux_nginx_local

    ports:
      - "8085:80"

    volumes:
      - ../:/var/www
      - ../docker/nginx/local.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

    networks:
      - liderlux_local

  db:
    image: mariadb:10.6
    container_name: liderlux_db_local

    ports:
      - "3307:3306"

    env_file:
      - ../.env.local

    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: liderlux
      MARIADB_USER: liderlux_user
      MARIADB_PASSWORD: password

    volumes:
      - liderlux_db_local:/var/lib/mysql

    networks:
      - liderlux_local

networks:
  liderlux_local:

volumes:
  liderlux_db_local:
